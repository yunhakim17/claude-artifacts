<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>한 글자의 미학</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 4:5 SNS 포스터. 왼쪽 58% 사진, 오른쪽 42% 전시 배너풍 보라 패널. 단일 테마(포스터). */
:root {
  --ground: #dcd8e6; --purple: #43358f; --purple-deep: #2f2569; --ink: #ffffff;
  --soft: #cfc8f0; --yellow: #f2c230;
  --display: "Nanum Myeongjo", "Batang", serif;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
html, body { background: var(--ground); }
body { padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; place-items: center; }
.poster { width: min(100%, 560px); aspect-ratio: 4 / 5; container-type: inline-size; display: grid; grid-template-columns: 58% 42%; overflow: hidden; box-shadow: 0 20px 50px rgba(30, 20, 70, .25); background: var(--purple); }
.photo { position: relative; min-width: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; max-width: 100%; }
.photo .stamp { position: absolute; left: 3cqw; bottom: 3cqw; background: var(--yellow); color: var(--purple-deep); font: 700 2.1cqw/1.2 var(--sans); padding: 1cqw 1.6cqw; letter-spacing: .04em; }

.panel { color: var(--ink); padding: 5cqw 4cqw 4cqw; display: flex; flex-direction: column; gap: 2.6cqw; min-width: 0; text-align: right; }
.kicker { font: 500 1.9cqw/1.45 var(--sans); color: var(--soft); }
h1 { margin: 0; font: 800 7.6cqw/1.12 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.en { font: 700 2.6cqw/1.3 var(--display); }
.type { font: 700 2.1cqw/1.3 var(--sans); color: var(--purple-deep); background: var(--yellow); padding: .8cqw 1.4cqw; align-self: flex-end; letter-spacing: .03em; }

.stats { display: grid; gap: 1.7cqw; margin-top: .6cqw; border-top: 1px solid rgba(255,255,255,.35); padding-top: 2.2cqw; }
.stat { display: grid; gap: .2cqw; }
.stat b { font: 500 4.6cqw/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat b small { font: 700 2.2cqw var(--sans); margin-left: .4cqw; }
.stat span { font: 400 1.75cqw/1.4 var(--sans); color: var(--soft); }

.quote { margin: 0; font: 700 2.25cqw/1.45 var(--display); border-top: 1px solid rgba(255,255,255,.35); padding-top: 2.2cqw; }
.quote em { font-style: normal; color: var(--yellow); }
.tags { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .8cqw; }
.tags span { font: 500 1.7cqw/1 var(--sans); border: 1px solid rgba(255,255,255,.55); padding: .8cqw 1.2cqw; border-radius: 99px; }
.foot { font: 400 1.45cqw/1.4 var(--sans); color: var(--soft); }
</style>
